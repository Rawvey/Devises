<style>
:root {
  /* Plan : un tableau de change de poche. Chiffres en mono, interface native iOS, une colonne. */
  --bg: #EDF0F4;
  --surface: #FFFFFF;
  --ink: #0E1A2C;
  --muted: #5D6A7D;
  --line: #DAE0E8;
  --accent: #2350D4;
  --accent-soft: rgba(35, 80, 212, .09);
  --up: #12804F;
  --up-soft: rgba(18, 128, 79, .11);
  --down: #C2362B;
  --down-soft: rgba(194, 54, 43, .10);
  --warn: #A86A12;
  --shadow: 0 1px 2px rgba(14, 26, 44, .05), 0 4px 14px rgba(14, 26, 44, .05);
  --font-num: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --font-ui: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #090D13;
    --surface: #121923;
    --ink: #E8EDF4;
    --muted: #8D99AB;
    --line: #222C3A;
    --accent: #7E9CFF;
    --accent-soft: rgba(126, 156, 255, .13);
    --up: #3CCB87;
    --up-soft: rgba(60, 203, 135, .13);
    --down: #FF6B5F;
    --down-soft: rgba(255, 107, 95, .13);
    --warn: #E8B04B;
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #090D13;
  --surface: #121923;
  --ink: #E8EDF4;
  --muted: #8D99AB;
  --line: #222C3A;
  --accent: #7E9CFF;
  --accent-soft: rgba(126, 156, 255, .13);
  --up: #3CCB87;
  --up-soft: rgba(60, 203, 135, .13);
  --down: #FF6B5F;
  --down-soft: rgba(255, 107, 95, .13);
  --warn: #E8B04B;
  --shadow: none;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}
button, select, input { font: inherit; color: inherit; }
button { touch-action: manipulation; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  max-width: 520px;
  margin: 0 auto;
  padding:
    calc(env(safe-area-inset-top) + 14px)
    max(16px, env(safe-area-inset-right))
    calc(env(safe-area-inset-bottom) + 28px)
    max(16px, env(safe-area-inset-left));
  display: flex;
  flex-direction: column;
  gap: 18px;
}

/* En-tête */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 4px 0; }
h1 { margin: 0; font-size: 32px; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em; text-wrap: balance; }
.status {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 7px 11px 7px 10px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface);
  font-size: 13px; font-weight: 500; color: var(--muted);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.status[data-state="live"] .dot { background: var(--up); animation: pulse 2s ease-in-out infinite; }
.status[data-state="daily"] .dot { background: var(--warn); }
.status[data-state="error"] { color: var(--down); }
.status[data-state="error"] .dot { background: var(--down); }
.status[data-busy="true"] .dot { animation: pulse .7s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }

/* Cartes */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); }

/* Convertisseur */
.conv { position: relative; }
.row {
  display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 12px;
  padding: 22px 16px;
  border-radius: 20px;
  transition: background-color .15s;
}
.row:focus-within { background: var(--accent-soft); }
.divider { position: relative; height: 1px; background: var(--line); margin: 0 16px; }
.cur { display: flex; flex-direction: column; align-items: flex-start; gap: 5px; max-width: 150px; }
.chip {
  position: relative;
  display: inline-flex; align-items: center; gap: 8px;
  padding: 7px 10px 7px 8px;
  border-radius: 12px;
  background: var(--accent-soft);
  font-size: 18px; font-weight: 650;
}
.row:focus-within .chip { background: var(--surface); }
.chip .flag { font-size: 22px; line-height: 1; }
.chip svg { width: 12px; height: 12px; color: var(--muted); flex: none; }
.chip select {
  position: absolute; inset: 0; width: 100%; height: 100%;
  opacity: 0; font-size: 16px; cursor: pointer; -webkit-appearance: none; appearance: none;
}
.chip:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.cname { font-size: 13px; line-height: 1.3; color: var(--muted); padding-left: 2px; }
.amt {
  width: 100%; min-width: 0;
  border: 0; outline: none; background: transparent;
  text-align: right;
  font-family: var(--font-num); font-weight: 500; font-size: 34px; letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
  caret-color: var(--accent);
  padding: 4px 0;
}
.amt::placeholder { color: var(--muted); opacity: .6; }
.swap {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 40px; height: 40px; border-radius: 50%;
  display: grid; place-items: center;
  border: 1px solid var(--line); background: var(--surface); color: var(--accent);
  box-shadow: var(--shadow);
  z-index: 1;
}
.swap svg { width: 18px; height: 18px; transition: transform .35s cubic-bezier(.3,.7,.3,1); }
.swap.turn svg { transform: rotate(180deg); }

.rateline {
  display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 14px;
  padding: 0 6px;
  font-family: var(--font-num); font-size: 14px; color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.rateline strong { color: var(--ink); font-weight: 500; }
.tick { display: inline-block; min-width: 1em; margin-left: 4px; font-size: 11px; }
.tick.up { color: var(--up); }
.tick.down { color: var(--down); }
.flash-up { animation: fu 1.2s ease-out; }
.flash-down { animation: fd 1.2s ease-out; }
@keyframes fu { 0% { color: var(--up); } 100% { color: var(--ink); } }
@keyframes fd { 0% { color: var(--down); } 100% { color: var(--ink); } }

/* Graphique */
.chart { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.chart-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.pair { font-size: 16px; font-weight: 650; }
.pair span { color: var(--muted); font-weight: 500; }
.chg {
  font-family: var(--font-num); font-size: 13px; font-weight: 500;
  padding: 4px 9px; border-radius: 999px;
  background: var(--bg); color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.chg.up { background: var(--up-soft); color: var(--up); }
.chg.down { background: var(--down-soft); color: var(--down); }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); padding: 3px; gap: 3px; background: var(--bg); border-radius: 11px; }
.seg button {
  border: 0; background: transparent; border-radius: 8px;
  padding: 7px 0; font-size: 13px; font-weight: 600; color: var(--muted);
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.plot { position: relative; height: 150px; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.plot svg { display: block; width: 100%; height: 100%; overflow: visible; }
.plot .line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.plot .area { stroke: none; }
.plot .stop { stop-color: var(--accent); }
.plot .grid { stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 4; }
.plot .glabel { fill: var(--muted); font-family: var(--font-num); font-size: 11px; }
.plot .end { fill: var(--accent); }
.plot .halo { fill: var(--accent); opacity: .18; }
.plot .cursor { stroke: var(--muted); stroke-width: 1; }
.plot .cdot { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
.plot .msg {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-size: 14px; color: var(--muted); text-align: center; padding: 0 20px;
}
.scrub {
  position: absolute; top: -6px; transform: translateX(-50%);
  padding: 4px 8px; border-radius: 8px;
  background: var(--ink); color: var(--surface);
  font-family: var(--font-num); font-size: 12px; white-space: nowrap;
  pointer-events: none; opacity: 0; transition: opacity .15s;
}
.scrub.on { opacity: 1; }
.chart-foot { display: flex; justify-content: space-between; gap: 10px; font-family: var(--font-num); font-size: 12px; color: var(--muted); }

/* Autres devises */
.list-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 0 6px; }
h2 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.linkbtn { border: 0; background: none; padding: 4px 0; color: var(--accent); font-size: 15px; font-weight: 500; }
.favs { list-style: none; margin: 0; padding: 0; }
.favs li { display: flex; align-items: center; }
.favs li + li { border-top: 1px solid var(--line); }
.fav {
  flex: 1; min-width: 0;
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px;
  padding: 13px 16px; border: 0; background: none; text-align: left;
}
.fav:active { background: var(--accent-soft); }
.favs li:first-child .fav { border-radius: 20px 20px 0 0; }
.favs li:last-child .fav { border-radius: 0 0 20px 20px; }
.fav .flag { font-size: 24px; line-height: 1; }
.who { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.who .code { font-weight: 650; font-size: 16px; }
.who .nm { font-size: 13px; color: var(--muted); }
.val { text-align: right; font-family: var(--font-num); font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums; }
.val small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); }
.rm {
  display: none; flex: none;
  width: 28px; height: 28px; margin-left: 14px; border-radius: 50%;
  border: 0; background: var(--down-soft); color: var(--down);
  font-size: 20px; line-height: 1; place-items: center;
}
.editing .rm { display: grid; }
.editing .fav { cursor: default; }
.addrow { display: none; padding: 12px 16px; border-top: 1px solid var(--line); }
.editing .addrow { display: block; }
.addrow .chip { font-size: 15px; font-weight: 600; color: var(--accent); }
.empty { padding: 16px; font-size: 14px; color: var(--muted); }

.note { margin: 0; padding: 0 6px; font-size: 12px; line-height: 1.55; color: var(--muted); max-width: 65ch; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <h1>Devises</h1>
    <button class="status" id="status" type="button" data-state="loading" aria-live="polite" aria-label="Actualiser les taux">
      <span class="dot"></span><span id="statusText">Chargement…</span>
    </button>
  </header>

  <section class="card conv" aria-label="Convertisseur">
    <div class="row">
      <div class="cur">
        <label class="chip" for="curA">
          <span class="flag" id="flagA"></span><span id="codeA"></span>
          <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <select id="curA" aria-label="Devise de départ"></select>
        </label>
        <span class="cname" id="nameA"></span>
      </div>
      <input class="amt" id="amtA" type="text" inputmode="decimal" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="0" aria-label="Montant dans la devise de départ">
    </div>
    <div class="divider">
      <button class="swap" id="swap" type="button" aria-label="Inverser les devises">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 3v13M6 16l-3-3M6 16l3-3M14 17V4M14 4l-3 3M14 4l3 3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="row">
      <div class="cur">
        <label class="chip" for="curB">
          <span class="flag" id="flagB"></span><span id="codeB"></span>
          <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <select id="curB" aria-label="Devise d'arrivée"></select>
        </label>
        <span class="cname" id="nameB"></span>
      </div>
      <input class="amt" id="amtB" type="text" inputmode="decimal" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="—" aria-label="Montant dans la devise d'arrivée">
    </div>
  </section>

  <div class="rateline" id="rateline">
    <span id="rate1">—</span>
    <span id="rate2"></span>
  </div>

  <section class="card chart" aria-label="Historique du taux">
    <div class="chart-head">
      <div class="pair" id="pair"></div>
      <div class="chg" id="chg">—</div>
    </div>
    <div class="seg" role="group" aria-label="Période">
      <button type="button" data-r="1S">7 j</button>
      <button type="button" data-r="1M">1 mois</button>
      <button type="button" data-r="3M">3 mois</button>
      <button type="button" data-r="1A">1 an</button>
    </div>
    <div class="plot" id="plot">
      <svg id="svg" aria-hidden="true"></svg>
      <div class="scrub" id="scrub"></div>
      <div class="msg" id="plotMsg">Chargement de l'historique…</div>
    </div>
    <div class="chart-foot"><span id="fStart"></span><span id="fEnd"></span></div>
  </section>

  <section aria-label="Autres devises">
    <div class="list-head">
      <h2 id="favHead">Autres devises</h2>
      <button class="linkbtn" id="edit" type="button">Modifier</button>
    </div>
    <div class="card" id="favCard" style="margin-top:8px">
      <ul class="favs" id="favs"></ul>
      <div class="addrow">
        <label class="chip" for="addSel">
          + Ajouter une devise
          <select id="addSel" aria-label="Ajouter une devise"></select>
        </label>
      </div>
    </div>
  </section>

  <p class="note" id="note">Taux moyens du marché, à titre indicatif. Ta banque ou ta carte applique en général une marge de 1 à 3 %.</p>
</main>

<script>
(() => {
  "use strict";

  /* ---------- Réglages ---------- */
  const REFRESH_MS = 30000;
  const CODES = ["EUR","CAD","USD","GBP","CHF","JPY","AUD","NZD","CNY","HKD","SGD","KRW","INR","THB","VND","IDR","PHP","MYR","MXN","BRL","ARS","CLP","COP","PEN","ZAR","EGP","MAD","TND","DZD","XOF","XAF","HTG","DOP","CUP","AED","SAR","QAR","ILS","TRY","SEK","NOK","DKK","ISK","PLN","CZK","HUF","RON","RSD","UAH"];
  const ECB = new Set(["AUD","BRL","CAD","CHF","CNY","CZK","DKK","EUR","GBP","HKD","HUF","IDR","ILS","INR","ISK","JPY","KRW","MXN","MYR","NOK","NZD","PHP","PLN","RON","SEK","SGD","THB","TRY","USD","ZAR"]);
  const RANGES = { "1S": 7, "1M": 30, "3M": 91, "1A": 365 };
  const LOC = /^fr/i.test(navigator.language || "") ? navigator.language : "fr-FR";

  /* ---------- Stockage local (facultatif) ---------- */
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  const saved = store.get("devises.etat.v1") || {};
  let A = saved.A || "EUR";
  let B = saved.B || "CAD";
  let base = saved.base && typeof saved.base.value === "number" ? saved.base : { side: "A", value: 100 };
  let range = RANGES[saved.range] ? saved.range : "1M";
  let favs = Array.isArray(saved.favs) ? saved.favs : ["USD", "GBP", "CHF", "JPY", "MXN"];
  const saveState = () => store.set("devises.etat.v1", { A, B, base, range, favs });

  const cached = store.get("devises.taux.v1");
  let rates = cached && cached.rates ? cached.rates : null;   // valeur de 1 USD dans chaque devise
  let meta = cached && cached.meta ? cached.meta : null;      // { source, live, ts, date }
  let busy = false, failed = false, lastTry = 0, tick = null;

  /* ---------- Formats ---------- */
  let names = null;
  try { names = new Intl.DisplayNames(["fr"], { type: "currency" }); } catch (e) {}
  const nameOf = c => {
    let n = c;
    try { n = names ? names.of(c) : c; } catch (e) {}
    return n.charAt(0).toUpperCase() + n.slice(1);
  };
  const FLAG_EX = { EUR: "EU", XOF: null, XAF: null };
  const flagOf = c => {
    const cc = c in FLAG_EX ? FLAG_EX[c] : c.slice(0, 2);
    if (!cc) return "🌍";
    return String.fromCodePoint(...[...cc].map(ch => 0x1F1A5 + ch.charCodeAt(0)));
  };
  const digitsCache = {};
  const digitsOf = c => {
    if (!(c in digitsCache)) {
      try { digitsCache[c] = new Intl.NumberFormat("en", { style: "currency", currency: c }).resolvedOptions().maximumFractionDigits; }
      catch (e) { digitsCache[c] = 2; }
    }
    return digitsCache[c];
  };
  const nfCache = {};
  const nf = (opts) => {
    const k = JSON.stringify(opts);
    return nfCache[k] || (nfCache[k] = new Intl.NumberFormat(LOC, opts));
  };
  const fmtAmt = (n, c) => {
    const d = digitsOf(c);
    return nf({ minimumFractionDigits: d, maximumFractionDigits: d }).format(n);
  };
  const fmtRate = r => {
    if (!isFinite(r)) return "—";
    if (r >= 100) return nf({ minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(r);
    if (r >= 1) return nf({ minimumFractionDigits: 4, maximumFractionDigits: 4 }).format(r);
    return nf({ minimumSignificantDigits: 4, maximumSignificantDigits: 4 }).format(r);
  };
  const parse = s => {
    const t = String(s).replace(/[\s  '’]/g, "").replace(",", ".");
    if (t === "" || t === ".") return NaN;
    const n = Number(t);
    return isFinite(n) && n >= 0 ? n : NaN;
  };
  const shortDate = (t, withYear) => new Intl.DateTimeFormat(LOC, withYear ? { day: "numeric", month: "short", year: "2-digit" } : { day: "numeric", month: "short" }).format(t);
  const ago = t => {
    const s = Math.max(0, Math.round((Date.now() - t) / 1000));
    if (s < 5) return "à l'instant";
    if (s < 60) return "il y a " + s + " s";
    const m = Math.floor(s / 60);
    if (m < 60) return "il y a " + m + " min";
    const h = Math.floor(m / 60);
    if (h < 24) return "il y a " + h + " h";
    return "le " + shortDate(t);
  };

  /* ---------- Éléments ---------- */
  const $ = id => document.getElementById(id);
  const el = {
    status: $("status"), statusText: $("statusText"),
    curA: $("curA"), curB: $("curB"), amtA: $("amtA"), amtB: $("amtB"),
    flagA: $("flagA"), flagB: $("flagB"), codeA: $("codeA"), codeB: $("codeB"), nameA: $("nameA"), nameB: $("nameB"),
    swap: $("swap"), rate1: $("rate1"), rate2: $("rate2"),
    pair: $("pair"), chg: $("chg"), plot: $("plot"), svg: $("svg"), scrub: $("scrub"), plotMsg: $("plotMsg"),
    fStart: $("fStart"), fEnd: $("fEnd"),
    favHead: $("favHead"), favs: $("favs"), favCard: $("favCard"), edit: $("edit"), addSel: $("addSel"), note: $("note")
  };

  const available = () => CODES.filter(c => !rates || rates[c] > 0);
  const conv = (x, f, t) => x * rates[t] / rates[f];

  /* ---------- Rendu ---------- */
  function fillSelect(sel, value) {
    const list = available();
    if (!list.includes(value)) list.unshift(value);
    sel.innerHTML = list.map(c => `<option value="${c}">${flagOf(c)} ${c} · ${nameOf(c)}</option>`).join("");
    sel.value = value;
  }
  function fit(input) {
    const n = input.value.length;
    input.style.fontSize = n > 14 ? "21px" : n > 11 ? "26px" : n > 9 ? "30px" : "";
  }
  function renderChips() {
    el.flagA.textContent = flagOf(A); el.codeA.textContent = A; el.nameA.textContent = nameOf(A);
    el.flagB.textContent = flagOf(B); el.codeB.textContent = B; el.nameB.textContent = nameOf(B);
    fillSelect(el.curA, A); fillSelect(el.curB, B);
    el.pair.innerHTML = `${A} <span>→</span> ${B}`;
  }
  function amountInA() {
    if (base.side === "A") return base.value;
    return rates && isFinite(base.value) ? conv(base.value, B, A) : NaN;
  }
  function renderConv() {
    const focused = document.activeElement;
    if (base.side === "A") {
      if (focused !== el.amtA) el.amtA.value = isFinite(base.value) ? fmtAmt(base.value, A) : "";
      if (rates) el.amtB.value = isFinite(base.value) ? fmtAmt(conv(base.value, A, B), B) : "";
    } else {
      if (focused !== el.amtB) el.amtB.value = isFinite(base.value) ? fmtAmt(base.value, B) : "";
      if (rates) el.amtA.value = isFinite(base.value) ? fmtAmt(conv(base.value, B, A), A) : "";
    }
    fit(el.amtA); fit(el.amtB);
    if (rates) {
      const t = tick ? `<span class="tick ${tick}">${tick === "up" ? "▲" : "▼"}</span>` : "";
      el.rate1.innerHTML = `<strong>1 ${A} = ${fmtRate(conv(1, A, B))} ${B}</strong>${t}`;
      el.rate2.textContent = `1 ${B} = ${fmtRate(conv(1, B, A))} ${A}`;
    } else {
      el.rate1.textContent = "Taux en attente…"; el.rate2.textContent = "";
    }
    renderFavs();
  }
  function renderFavs() {
    const amt = amountInA();
    const shown = isFinite(amt) && amt > 0 ? amt : 1;
    el.favHead.textContent = `Pour ${fmtAmt(shown, A)} ${A}`;
    const list = favs.filter(c => c !== A && c !== B && (!rates || rates[c] > 0));
    if (!list.length) {
      el.favs.innerHTML = `<li class="empty">Aucune autre devise. Touche « Modifier » pour en ajouter.</li>`;
    } else {
      el.favs.innerHTML = list.map(c => {
        const v = rates ? fmtAmt(conv(shown, A, c), c) : "—";
        const r = rates ? `1 ${A} = ${fmtRate(conv(1, A, c))}` : "";
        return `<li><button class="rm" type="button" data-rm="${c}" aria-label="Retirer ${c}">−</button>` +
          `<button class="fav" type="button" data-c="${c}" aria-label="Convertir ${A} en ${c}">` +
          `<span class="flag">${flagOf(c)}</span>` +
          `<span class="who"><span class="code">${c}</span><span class="nm">${nameOf(c)}</span></span>` +
          `<span class="val">${v}<small>${r}</small></span></button></li>`;
      }).join("");
    }
    const addable = available().filter(c => !favs.includes(c) && c !== A && c !== B);
    el.addSel.innerHTML = `<option value="" selected disabled>Choisir…</option>` +
      addable.map(c => `<option value="${c}">${flagOf(c)} ${c} · ${nameOf(c)}</option>`).join("");
  }
  function renderStatus() {
    let state, text;
    if (!rates) {
      state = busy ? "loading" : "error";
      text = busy ? "Chargement…" : "Pas de connexion · Réessayer";
    } else if (busy && Date.now() - meta.ts > 120000) {
      state = "stale"; text = "Actualisation…";
    } else if (failed) {
      state = "stale"; text = "Hors ligne · " + ago(meta.ts);
    } else if (meta.live) {
      state = "live"; text = "En direct · " + ago(meta.ts);
    } else {
      state = "daily"; text = "Taux du jour · " + shortDate(meta.date || meta.ts);
    }
    el.status.dataset.state = state;
    el.status.dataset.busy = String(busy && !!rates);
    if (el.statusText.textContent !== text) el.statusText.textContent = text;
  }
  function renderNote() {
    const src = meta ? meta.source : null;
    const how = meta && meta.live ? "actualisés toutes les 30 secondes" : "mis à jour une fois par jour";
    el.note.textContent = (src ? `Source : ${src}, ${how}. ` : "") +
      "Taux moyens du marché, à titre indicatif. Ta banque ou ta carte applique en général une marge de 1 à 3 %." +
      " Historique : Banque centrale européenne.";
  }

  /* ---------- Réseau ---------- */
  async function getJSON(url, ms = 8000) {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), ms);
    try {
      const r = await fetch(url, { signal: ctl.signal, cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      return await r.json();
    } finally { clearTimeout(timer); }
  }
  const SOURCES = [
    async () => {
      const j = await getJSON("https://api.coinbase.com/v2/exchange-rates?currency=USD");
      const out = { USD: 1 };
      for (const [k, v] of Object.entries(j.data.rates)) { const x = parseFloat(v); if (x > 0) out[k] = x; }
      return { rates: out, source: "Coinbase", live: true };
    },
    async () => {
      const j = await getJSON("https://open.er-api.com/v6/latest/USD");
      if (j.result !== "success") throw new Error("er-api");
      return { rates: j.rates, source: "ExchangeRate-API", live: false, date: j.time_last_update_unix * 1000 };
    },
    async () => {
      const j = await getJSON("https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json");
      const out = {};
      for (const [k, v] of Object.entries(j.usd)) out[k.toUpperCase()] = v;
      return { rates: out, source: "Currency API", live: false, date: Date.parse(j.date) };
    }
  ];
  async function loadRates() {
    if (busy) return;
    busy = true; lastTry = Date.now(); renderStatus();
    let ok = false;
    for (const src of SOURCES) {
      try {
        const res = await src();
        if (!res.rates || !(res.rates.EUR > 0) || !(res.rates.CAD > 0)) throw new Error("incomplet");
        applyRates(res);
        ok = true; break;
      } catch (e) { /* source suivante */ }
    }
    busy = false; failed = !ok;
    renderStatus();
  }
  function applyRates(res) {
    const before = rates && rates[A] && rates[B] ? conv(1, A, B) : null;
    const hadList = available().join();
    rates = res.rates;
    meta = { source: res.source, live: res.live, ts: Date.now(), date: res.date || null };
    store.set("devises.taux.v1", { rates, meta });
    if (!rates[A]) A = "EUR";
    if (!rates[B]) B = A === "CAD" ? "EUR" : "CAD";
    const after = conv(1, A, B);
    if (before !== null && Math.abs(after - before) / before > 1e-7) {
      tick = after > before ? "up" : "down";
      const target = base.side === "A" ? el.amtB : el.amtA;
      target.classList.remove("flash-up", "flash-down");
      void target.offsetWidth;
      target.classList.add(tick === "up" ? "flash-up" : "flash-down");
    }
    if (available().join() !== hadList) renderChips();
    renderConv(); renderNote();
    if (series) drawChart();
  }

  /* ---------- Graphique ---------- */
  const chartCache = new Map();
  let series = null;       // points ECB [[t, v], ...]
  let chartKey = "";
  const iso = d => d.toISOString().slice(0, 10);

  async function loadChart() {
    const key = A + B + range;
    chartKey = key;
    document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.r === range)));
    if (!ECB.has(A) || !ECB.has(B)) {
      series = null; drawChart("Pas d'historique pour cette paire. Le taux en direct reste à jour.");
      return;
    }
    if (chartCache.has(key)) { series = chartCache.get(key); drawChart(); return; }
    series = null; drawChart("Chargement de l'historique…");
    const start = iso(new Date(Date.now() - RANGES[range] * 864e5));
    const urls = [
      `https://api.frankfurter.dev/v1/${start}..?base=${A}&symbols=${B}`,
      `https://api.frankfurter.app/${start}..?from=${A}&to=${B}`
    ];
    for (const u of urls) {
      try {
        const j = await getJSON(u, 10000);
        const pts = Object.entries(j.rates)
          .map(([d, o]) => [Date.parse(d + "T16:00:00Z"), o[B]])
          .filter(p => p[1] > 0)
          .sort((a, b) => a[0] - b[0]);
        if (pts.length < 2) throw new Error("vide");
        chartCache.set(key, pts);
        if (chartKey === key) { series = pts; drawChart(); }
        return;
      } catch (e) { /* essai suivant */ }
    }
    if (chartKey === key) drawChart("Historique indisponible pour le moment.");
  }

  let plotPts = [];
  function drawChart(message) {
    const svg = el.svg;
    if (!series) {
      svg.innerHTML = ""; plotPts = [];
      el.plotMsg.textContent = message || ""; el.plotMsg.hidden = !message;
      el.chg.className = "chg"; el.chg.textContent = "—";
      el.fStart.textContent = ""; el.fEnd.textContent = "";
      return;
    }
    el.plotMsg.hidden = true;
    const pts = series.slice();
    if (rates && rates[A] && rates[B]) pts.push([Date.now(), conv(1, A, B)]);
    const W = el.plot.clientWidth || 320, H = el.plot.clientHeight || 150;
    const padT = 12, padB = 12, padR = 6;
    const vs = pts.map(p => p[1]);
    let lo = Math.min(...vs), hi = Math.max(...vs);
    if (hi - lo < 1e-9) { hi += hi * 0.001; lo -= lo * 0.001; }
    const t0 = pts[0][0], t1 = pts[pts.length - 1][0];
    const x = t => ((t - t0) / (t1 - t0 || 1)) * (W - padR);
    const y = v => padT + (1 - (v - lo) / (hi - lo)) * (H - padT - padB);
    plotPts = pts.map(p => [x(p[0]), y(p[1]), p[0], p[1]]);
    const d = plotPts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join("");
    const last = plotPts[plotPts.length - 1];
    const area = d + `L${last[0].toFixed(1)} ${H}L0 ${H}Z`;
    const yHi = y(hi), yLo = y(lo);
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.innerHTML =
      `<defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">` +
      `<stop class="stop" offset="0" stop-opacity=".24"/><stop class="stop" offset="1" stop-opacity="0"/></linearGradient></defs>` +
      `<line class="grid" x1="0" x2="${W}" y1="${yHi}" y2="${yHi}"/>` +
      `<line class="grid" x1="0" x2="${W}" y1="${yLo}" y2="${yLo}"/>` +
      `<text class="glabel" x="0" y="${yHi - 4}">${fmtRate(hi)}</text>` +
      `<text class="glabel" x="0" y="${yLo + 13}">${fmtRate(lo)}</text>` +
      `<path class="area" d="${area}" fill="url(#fill)"/>` +
      `<path class="line" d="${d}"/>` +
      `<circle class="halo" cx="${last[0]}" cy="${last[1]}" r="9"/>` +
      `<circle class="end" cx="${last[0]}" cy="${last[1]}" r="4"/>` +
      `<g id="cur" style="display:none"><line class="cursor" id="curLine" y1="0" y2="${H}"/><circle class="cdot" id="curDot" r="4.5"/></g>`;
    const first = pts[0][1], now = pts[pts.length - 1][1];
    const pct = (now / first - 1) * 100;
    el.chg.className = "chg " + (pct > 0.005 ? "up" : pct < -0.005 ? "down" : "");
    el.chg.textContent = (pct > 0 ? "+" : pct < 0 ? "−" : "") + nf({ minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(Math.abs(pct)) + " %";
    el.fStart.textContent = shortDate(t0, range === "1A");
    el.fEnd.textContent = rates ? "maintenant" : shortDate(t1);
  }

  let hideTimer = null;
  function scrubAt(clientX) {
    if (!plotPts.length) return;
    const rect = el.plot.getBoundingClientRect();
    const px = clientX - rect.left;
    let best = plotPts[0];
    for (const p of plotPts) if (Math.abs(p[0] - px) < Math.abs(best[0] - px)) best = p;
    const g = document.getElementById("cur");
    if (!g) return;
    g.style.display = "";
    const line = document.getElementById("curLine"), dot = document.getElementById("curDot");
    line.setAttribute("x1", best[0]); line.setAttribute("x2", best[0]);
    dot.setAttribute("cx", best[0]); dot.setAttribute("cy", best[1]);
    const isLive = best === plotPts[plotPts.length - 1] && rates;
    el.scrub.textContent = (isLive ? "Maintenant" : shortDate(best[2], range === "1A")) + " · " + fmtRate(best[3]);
    const half = el.scrub.offsetWidth / 2;
    el.scrub.style.left = Math.min(Math.max(best[0], half), rect.width - half) + "px";
    el.scrub.classList.add("on");
    clearTimeout(hideTimer);
  }
  function scrubEnd() {
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => {
      el.scrub.classList.remove("on");
      const g = document.getElementById("cur"); if (g) g.style.display = "none";
    }, 1400);
  }
  el.plot.addEventListener("pointerdown", e => scrubAt(e.clientX));
  el.plot.addEventListener("pointermove", e => scrubAt(e.clientX));
  el.plot.addEventListener("pointerup", scrubEnd);
  el.plot.addEventListener("pointercancel", scrubEnd);
  el.plot.addEventListener("pointerleave", scrubEnd);

  /* ---------- Interactions ---------- */
  function onType(side) {
    const input = side === "A" ? el.amtA : el.amtB;
    base = { side, value: parse(input.value) };
    tick = null;
    renderConv(); saveState();
  }
  el.amtA.addEventListener("input", () => onType("A"));
  el.amtB.addEventListener("input", () => onType("B"));
  [el.amtA, el.amtB].forEach(inp => {
    inp.addEventListener("focus", () => setTimeout(() => { try { inp.setSelectionRange(0, inp.value.length); } catch (e) {} }, 0));
    inp.addEventListener("blur", () => renderConv());
    inp.addEventListener("keydown", e => { if (e.key === "Enter") inp.blur(); });
  });
  // Ferme le clavier quand on touche ailleurs
  document.addEventListener("pointerdown", e => {
    const a = document.activeElement;
    if (a && a.tagName === "INPUT" && !e.target.closest("input")) a.blur();
  });

  function setCurrencies(nA, nB) {
    A = nA; B = nB; tick = null;
    renderChips(); renderConv(); saveState(); loadChart();
  }
  el.curA.addEventListener("change", () => {
    const v = el.curA.value;
    if (v === B) { base = { side: "A", value: amountInA() }; setCurrencies(B, A); }
    else setCurrencies(v, B);
  });
  el.curB.addEventListener("change", () => {
    const v = el.curB.value;
    if (v === A) { base = { side: "A", value: amountInA() }; setCurrencies(B, A); }
    else setCurrencies(A, v);
  });
  el.swap.addEventListener("click", () => {
    const top = amountInA();
    base = { side: "A", value: isFinite(top) ? top : 100 };
    el.swap.classList.toggle("turn");
    setCurrencies(B, A);
  });

  el.favs.addEventListener("click", e => {
    const rm = e.target.closest("[data-rm]");
    if (rm) { favs = favs.filter(c => c !== rm.dataset.rm); renderFavs(); saveState(); return; }
    const f = e.target.closest("[data-c]");
    if (!f || el.favCard.classList.contains("editing")) return;
    const c = f.dataset.c;
    const i = favs.indexOf(c);
    if (i >= 0 && !favs.includes(B)) favs[i] = B;
    base = { side: "A", value: amountInA() };
    setCurrencies(A, c);
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
  el.edit.addEventListener("click", () => {
    const on = el.favCard.classList.toggle("editing");
    el.edit.textContent = on ? "OK" : "Modifier";
  });
  el.addSel.addEventListener("change", () => {
    const c = el.addSel.value;
    if (c && !favs.includes(c)) { favs.push(c); saveState(); }
    renderFavs();
  });
  document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
    range = b.dataset.r; saveState(); loadChart();
  }));
  el.status.addEventListener("click", () => loadRates());

  let rz = null;
  window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => series && drawChart(), 120); });
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && Date.now() - lastTry > 10000) loadRates();
  });
  window.addEventListener("online", () => { loadRates(); if (!series) loadChart(); });

  setInterval(() => {
    renderStatus();
    if (!document.hidden && Date.now() - lastTry > REFRESH_MS) loadRates();
  }, 1000);

  /* ---------- Démarrage ---------- */
  renderChips(); renderConv(); renderNote(); renderStatus();
  loadRates();
  loadChart();
})();
</script>
</body>
</html>
